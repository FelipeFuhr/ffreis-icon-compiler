# Deck preset key definitions. One entry per unique icon the Fifine D6 deck.yaml
# references (by output stem `id` -> <id>.png). Derived from the live
# ffreis-opendeck-config/deck.yaml key inventory.
#
#   glyph.source: fontawesome (FA Solid) | simpleicons (brand) | ai (bespoke svg)
#   accent:       a key in the merged palette — OMIT IT on keys whose colour is
#                 owned elsewhere (the ws-* keys), where it comes from the
#                 generated derived.json instead. See that block below.
#   nav: true     draws the page-navigation badge (hub<->page keys)
#   doubleBorder: true   draws a second, inset accent ring — used on the
#                        deck.yaml `menu_rows.main` icons (the constant
#                        Home/Dev/Lab/Studio/Screen bottom row) so they read
#                        as a distinct navigation strip vs. regular content
#                        buttons at a glance, independent of the `nav` badge
#                        (which only the actual page-switch keys carry —
#                        `screen` doesn't switch pages, so it gets the ring
#                        without the badge).
#   active: true  ALSO renders a same-id `<id>-active.png`: solid accent fill,
#                 dark-ink foreground (negative/inverted look) — a page composing
#                 `menu_rows.main` can swap this in for just its own key so the
#                 current page's nav icon reads as selected ("you are here").
#                 Only the four page-switch icons carry it — `screen` isn't a
#                 page, so there's no "selected" state for it to show.
#
# The bespoke `ai` names must have a matching presets/deck/glyphs/ai/<name>.svg.
keys:
  # ── standard actions (Font Awesome Solid) ──────────────────────────────
  - { id: mic, label: MIC, accent: cyan, glyph: { source: fontawesome, name: microphone } }
  - { id: play-pause, label: PLAY, accent: amber, glyph: { source: fontawesome, name: play } }
  - { id: code, label: CODE, accent: violet, glyph: { source: fontawesome, name: code } }
  - { id: term, label: TERM, accent: violet, glyph: { source: fontawesome, name: terminal } }
  - { id: ssh, label: SSH, accent: green, glyph: { source: fontawesome, name: server } }
  - { id: lock, label: LOCK, accent: red, glyph: { source: fontawesome, name: lock } }
  - { id: shot, label: SHOT, accent: red, glyph: { source: fontawesome, name: crop } }
  - { id: devlink, label: LINKS, accent: green, glyph: { source: fontawesome, name: link } }
  - { id: prs, label: PRS, accent: violet, glyph: { source: fontawesome, name: code-pull-request } }
  - { id: previous, label: PREV, accent: amber, glyph: { source: fontawesome, name: backward-step } }
  - { id: next, label: NEXT, accent: amber, glyph: { source: fontawesome, name: forward-step } }
  - { id: volume-down, label: "VOL-", accent: amber, glyph: { source: fontawesome, name: volume-low } }
  - { id: volume-up, label: "VOL+", accent: amber, glyph: { source: fontawesome, name: volume-high } }
  - { id: spk, label: SPK, accent: cyan, glyph: { source: fontawesome, name: volume-xmark } }
  - { id: phones, label: PHONES, accent: cyan, glyph: { source: fontawesome, name: headphones } }
  - { id: spkrs, label: SPKRS, accent: cyan, glyph: { source: fontawesome, name: volume-high } }
  - { id: dnd, label: DND, accent: red, glyph: { source: fontawesome, name: bell-slash } }
  - { id: theme, label: THEME, accent: violet, glyph: { source: fontawesome, name: circle-half-stroke } }
  - { id: files, label: FILES, accent: amber, glyph: { source: fontawesome, name: folder } }
  - { id: screen, label: SCREEN, accent: cyan, doubleBorder: true, glyph: { source: fontawesome, name: power-off } }
  - { id: night, label: NIGHT, accent: violet, glyph: { source: fontawesome, name: moon } }
  - { id: suspend, label: SLEEP, accent: red, glyph: { source: fontawesome, name: bed } }
  - { id: sys-resources, label: STATS, accent: green, glyph: { source: fontawesome, name: microchip } }

  # ── page navigation (Font Awesome + nav badge) ─────────────────────────
  - { id: page-dev, label: DEV, accent: violet, nav: true, doubleBorder: true, active: true, glyph: { source: fontawesome, name: code } }
  - { id: page-lab, label: LAB, accent: green, nav: true, doubleBorder: true, active: true, glyph: { source: fontawesome, name: flask } }
  - { id: page-media, label: MEDIA, accent: amber, nav: true, glyph: { source: fontawesome, name: music } }
  - { id: page-system, label: SYS, accent: red, nav: true, doubleBorder: true, active: true, glyph: { source: fontawesome, name: gears } }
  - { id: home, label: HOME, accent: cyan, nav: true, doubleBorder: true, active: true, glyph: { source: fontawesome, name: house } }

  # ── workspace picker (Claude key -> transient section) ─────────────────
  # One key per logical workspace in ffreis-workspace-manager/workspace/registry.yaml,
  # in registry order.
  #
  # NOTE THE MISSING `accent:`. It is deliberate and load-bearing: the registry
  # assigns each workspace an accent NAME and its palette.json defines that
  # name's hex, so this file storing either would be a second copy of somebody
  # else's decision — and it drifted the first time it existed (11 of 12
  # disagreed). Both now come from the generated `derived.json` beside this file
  # (regenerate: `npm run sync:deck`), keyed by the `id` below.
  #
  # What IS this repo's to decide, and so stays here: the id, the 8-char label
  # (the D6's LCD budget), and which glyph draws it. A new workspace upstream
  # therefore still needs a new entry here — the tests say so by name.
  - { id: ws-root, label: ROOT, glyph: { source: fontawesome, name: folder-tree } }
  - { id: ws-website, label: WEB, glyph: { source: fontawesome, name: globe } }
  - { id: ws-petlook, label: PETLOOK, glyph: { source: fontawesome, name: paw } }
  - { id: ws-platform, label: PLATFORM, glyph: { source: fontawesome, name: layer-group } }
  - { id: ws-shared, label: SHARED, glyph: { source: fontawesome, name: share-nodes } }
  - { id: ws-ml, label: ML, glyph: { source: fontawesome, name: brain } }
  - { id: ws-stock, label: STOCK, glyph: { source: fontawesome, name: chart-line } }
  - { id: ws-content, label: CONTENT, glyph: { source: fontawesome, name: feather } }
  - { id: ws-entitlements, label: ENTITLE, glyph: { source: fontawesome, name: key } }
  - { id: ws-desk, label: DESK, glyph: { source: fontawesome, name: sliders } }
  - { id: ws-foundry, label: FOUNDRY, glyph: { source: fontawesome, name: hammer } }
  - { id: ws-games, label: GAMES, glyph: { source: fontawesome, name: gamepad } }
  - { id: ws-tooling, label: TOOLING, glyph: { source: fontawesome, name: screwdriver-wrench } }
  - { id: ws-dashboard, label: DASH, glyph: { source: fontawesome, name: gauge-high } }

  # ── brand marks (Simple Icons) ─────────────────────────────────────────
  - { id: claude, label: CLAUDE, accent: violet, glyph: { source: simpleicons, name: claude } }
  - { id: github-notifications, label: GITHUB, accent: violet, glyph: { source: simpleicons, name: github } }
  - { id: k3s, label: K3S, accent: green, glyph: { source: simpleicons, name: k3s } }
  - { id: grafana, label: GRAFANA, accent: amber, glyph: { source: simpleicons, name: grafana } }
  - { id: aws-cost, label: AWS, accent: amber, glyph: { source: simpleicons, name: amazonwebservices } }
  - { id: spotify, label: SPOTIFY, accent: green, glyph: { source: simpleicons, name: spotify } }

  # ── bespoke monochrome pictograms (ai/*.svg) ───────────────────────────
  - { id: meet, label: MEET, accent: cyan, glyph: { source: ai, name: meet } }
  - { id: pulse, label: PULSE, accent: violet, glyph: { source: ai, name: pulse } }
  - { id: reaper, label: REAP, accent: violet, glyph: { source: ai, name: reaper } }
  - { id: note, label: NOTE, accent: amber, glyph: { source: ai, name: note } }
  - { id: pomo, label: POMO, accent: red, glyph: { source: ai, name: pomo } }
  - { id: vpn-fix, label: VPN, accent: green, glyph: { source: ai, name: vpn-fix } }
  - { id: smoke, label: SMOKE, accent: red, glyph: { source: ai, name: smoke } }
  - { id: prune, label: PRUNE, accent: red, glyph: { source: ai, name: prune } }
  - { id: guard, label: GUARD, accent: green, glyph: { source: ai, name: guard } }
  - { id: k9s, label: K9S, accent: green, glyph: { source: ai, name: k9s } }
  - { id: output, label: OUTPUT, accent: cyan, glyph: { source: ai, name: output } }
