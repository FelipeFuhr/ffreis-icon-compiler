# Deck preset theme — palette + default output size for the Fifine D6 (100x100).
#
# THIS FILE HOLDS ONLY THE ACCENTS THIS REPO OWNS. The workspace palette
# (rosewater, sky, peach, blue, teal, mauve, green, yellow, red, sapphire,
# maroon, pink, slate, lime) belongs to ffreis-workspace-manager and arrives via
# the generated `derived.json` beside this file — re-listing any of those names
# here would silently override the source of truth with a hand-typed hex, which
# is exactly the drift this preset just removed. A test fails if one reappears.
#
# Palette precedence: compiler defaults < derived.json < this file.
size: 100
palette:
  amber: { hex: "#ffbd4a", rgb: "255,189,74" }
  cyan: { hex: "#22d3ee", rgb: "34,211,238" }
  violet: { hex: "#a876ff", rgb: "168,118,255" }
